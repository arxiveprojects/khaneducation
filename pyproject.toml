[project]
name = "api"
version = "0.2.0"
description = "Khan Education school OS API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.1",
    "mangum>=0.19.0",
    "passlib>=1.7.4",
    "pydantic[email]>=2.11.7",
    "pydantic-settings>=2.10.1",
    "python-jose>=3.5.0",
    "bcrypt==4.0.1",
    "boto3>=1.34.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "fastapi[standard]>=0.116.1",
    "ruff>=0.12.3",
    "typer>=0.16.0",
]

[tool.ruff]
line-length = 150
